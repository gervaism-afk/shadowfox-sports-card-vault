name: Refresh saved community checklists
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: write
concurrency:
  group: community-reference-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/refresh-community-references.ts
      - run: npm test
      - name: Save attributed reference data
        run: |
          git add data/community-checklists.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh attributed community checklist references'
          git push origin HEAD:main
